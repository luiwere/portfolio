<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Luiz Were</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div class="bg-deco" aria-hidden="true"></div>

  <main class="container" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4rem 1.5rem;">
    <div style="background: var(--color-surface-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 3.5rem 2.5rem; max-width: 500px; backdrop-filter: var(--glass-blur); box-shadow: var(--shadow-lg);">
      <span class="section-tag" style="margin-bottom: 1rem;">404 Error</span>
      <h1 style="font-family: var(--font-heading); font-size: 2.5rem; margin: 0 0 1rem; color: #ffffff;">Page Not Found</h1>
      <p style="color: var(--color-text-secondary); margin: 0 0 2rem; font-size: 1.05rem;">
        The page you are looking for doesn't exist, has been removed, or the link is broken.
      </p>
      <a href="index.html" class="btn btn-primary">
        <span>Return to Portfolio</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
  </main>
</body>
</html>
